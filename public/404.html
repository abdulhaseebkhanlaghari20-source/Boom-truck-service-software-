<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sahra Boom Truck Expense & Profit Tracker</title>
    <script>
      (function() {
        var repoBase = '/Boom-truck-service-software-/';
        var path = window.location.pathname;
        if (path.indexOf(repoBase) === 0) {
          var segment = path.slice(repoBase.length).replace(/^\/+/, '');
          if (segment) {
            window.location.replace(repoBase + '#/' + segment + window.location.search);
            return;
          }
        }
        window.location.replace(repoBase);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to Sahra Boom Truck Management...</p>
  </body>
</html>
